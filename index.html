<style>
/* Layout: phone-first app shell. Header, scrolling screen, fixed bottom tab bar. Single dark brand look (the logo's black), glaze red as the one accent, dough gold for progress. */
:root{
  --bg:#111110;
  --surface:#1B1A18;
  --surface-2:#24221F;
  --line:#33302B;
  --fg:#F7F4EF;
  --muted:#A39C92;
  --glaze:#E5323B;
  --glaze-deep:#B8212A;
  --dough:#E9A863;
  --ok:#6FCF8E;
  --display:"Rubik","Arial Black",system-ui,sans-serif;
  --body:"Manrope","Segoe UI",system-ui,sans-serif;
  --r:16px;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--dough);outline-offset:2px;border-radius:8px}
.app{max-width:520px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(92px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:26px;font-weight:800;line-height:1.1}
h2{font-size:19px;font-weight:700}
h3{font-size:16px;font-weight:700;line-height:1.25}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.section{display:flex;flex-direction:column;gap:12px;margin-top:26px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}

/* top bar */
.top{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:6px 10px}
.top img{width:40px;height:40px;border-radius:12px;flex:none}
.top .who{min-width:0;flex:1}
.top .who b{display:block;font-family:var(--display);font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--fg);white-space:nowrap}
.chip.glaze{background:var(--glaze);color:#fff}
.chip.dough{background:rgba(233,168,99,.16);color:var(--dough)}

/* hero: the glaze drip */
.hero{position:relative;overflow:hidden;border-radius:22px;background:var(--surface);padding:22px 18px 18px;display:flex;flex-direction:column;gap:14px}
.hero .drip{position:absolute;inset:0 0 auto 0;height:34px;color:var(--glaze)}
.hero .drip svg{display:block;width:100%;height:34px}
.hero > *:not(.drip){position:relative}
.hero h1{margin-top:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;font-family:var(--display);font-weight:700;font-size:15px;text-decoration:none}
.btn.primary{background:var(--glaze);color:#fff}
.btn.primary:active{background:var(--glaze-deep)}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.block{width:100%}

/* progress */
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--dough);border-radius:99px;transition:width .4s ease}
.nums{font-variant-numeric:tabular-nums}

/* cards & lists */
.card{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.list{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;text-align:left;width:100%;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .txt b{font-weight:700;font-size:15px;line-height:1.3}
.item .txt span{font-size:13px;color:var(--muted)}
.num{flex:none;width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.num.done{background:rgba(111,207,142,.15);color:var(--ok)}
.num.now{background:var(--glaze);color:#fff}
.num.lock{color:var(--muted)}
.item.locked .txt b{color:var(--muted)}
.chev{flex:none;color:var(--muted)}

.courses{display:grid;grid-template-columns:1fr;gap:10px}
.course{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--surface);border-radius:var(--r);padding:16px;width:100%}
.course .meta{display:flex;gap:8px;flex-wrap:wrap}
.course h3{font-size:17px}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:none;padding:8px 13px;border-radius:999px;background:var(--surface);font-size:13px;font-weight:700;border:1px solid var(--line)}
.fchip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.search{width:100%;min-height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0 14px;font:inherit}
.search::placeholder{color:var(--muted)}

.card.event{flex-direction:row;gap:14px;align-items:center}
.date{flex:none;width:58px;border-radius:14px;background:var(--glaze);color:#fff;text-align:center;padding:8px 0}
.date b{display:block;font-family:var(--display);font-size:24px;font-weight:800;line-height:1}
.date span{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}

.links{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.link{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px;text-decoration:none;min-width:0}
.link b{font-family:var(--display);font-size:14px;font-weight:700}
.link span{font-size:12px;color:var(--muted)}

/* quiz */
.quiz{display:flex;flex-direction:column;gap:18px;padding-top:8px}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:5px;border-radius:9px;background:var(--surface-2)}
.steps i.on{background:var(--glaze)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px;font-weight:600}
.opt:hover{border-color:var(--muted)}
.opt .em{flex:none;width:30px;text-align:center;font-size:20px}

/* result */
.level{display:flex;align-items:center;gap:14px}
.level .ring{flex:none;width:64px;height:64px;border-radius:20px;background:var(--surface-2);display:grid;place-items:center;font-size:32px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(17,17,16,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs nav{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:700;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--fg)}
.tab[aria-current="page"] svg{color:var(--glaze)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;background:var(--surface);border-radius:22px 22px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;max-height:88%;overflow-y:auto;animation:up .22s ease}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 4px}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--fg);color:var(--bg);font-weight:700;padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px)}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--muted);padding:6px 0}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:18px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>

function buildTrack(a){
  const lvl=a.stage==="none"?"t":a.stage;
  const isProd=lvl==="prod"||a.pain==="clients"||a.goal==="clients";
  const score=l=>{
    let s=0;
    if(l.c==="producer"){ if(!isProd) return -1; s+=6+(lvl==="prod"?2:0); }
    else if(l.c==="camera"){ s+=CAMB[a.cam][l.b]||0; if(a.pain==="camera") s+=3; if(a.cam==="off") return -1; }
    else{ const ul=lvl==="prod"?"p":lvl; if(l.lvl.includes(ul)) s+=2; else s-=2; if(a.stage==="none"&&l.n<=6) s+=3; }
    const pw=PAIN[a.pain]||{},gw=GOAL[a.goal]||{};
    l.tags.forEach(t=>{s+=(pw[t]||0)+(gw[t]||0)});
    return s;
  };
  const ranked=L.map(l=>({l,s:score(l)})).filter(x=>x.s>0).sort((x,y)=>y.s-x.s);
  let pick=ranked.slice(0,LEN[a.time]).map(x=>x.l);
  if(!pick.length) pick=courseLessons("school").slice(0,LEN[a.time]);
  const off={school:0,camera:-.4,producer:lvl==="prod"?-30:30};
  pick.sort((x,y)=>(x.n+off[x.c]*(x.c==="camera"?x.n:1))-(y.n+off[y.c]*(y.c==="camera"?y.n:1)));
  const focus={ideas:"идеи и контент-план",views:"просмотры и упаковку",camera:"уверенность в кадре",retention:"удержание и сценарий",money:"продажи с канала",clients:"поиск клиентов"}[a.pain];
  const goal={first:"первые 1&nbsp;000 подписчиков",stable:"стабильные просмотры",income:"доход с канала",clients:"первых клиентов"}[a.goal];
  return {lvl,ids:pick.map(l=>l.id),focus,goal,at:Date.now()};
}

    <a class="link" href="${link(lv?TOPICS[lv.chat]:TOPICS.general)}" target="_blank" rel="noopener"><b>${lv?lv.icon+" Чат «"+lv.name+"»":"💬 Общий чат"}</b><span>${lv?"Люди твоего уровня":"Вопросы и общение"}</span></a>
    <a class="link" href="${link(TOPICS.rules)}" target="_blank" rel="noopener"><b>📌 Начни здесь</b><span>Правила и навигация</span></a>
  </div></section>`;
}

function Track(){
  const t=trackState(); if(!t) return Home();
  const lv=LEVELS[S.profile.lvl];
  return `<button class="back" data-tab="home">← Назад</button>
  <section class="stack"><span class="eyebrow">${lv.icon} ${lv.name} · ${lv.line}</span>
    <h1>Твой трек</h1>
    <p class="muted">Фокус на ${S.profile.focus}. Цель: ${S.profile.goal}. Открыт один урок: посмотри его и отметь просмотренным, тогда откроется следующий. Все курсы целиком всегда доступны во вкладке «Курсы».</p>
    <div class="row"><div class="bar" style="flex:1"><i style="width:${t.done/t.total*100}%"></i></div><span class="nums muted">${t.done} / ${t.total}</span></div>
  </section>
  <div class="list" style="margin-top:18px">${t.ids.map((id,i)=>itemLesson(byId[id],{idx:i+1,course:1,now:i===t.cur,locked:t.cur>=0&&i>t.cur})).join("")}</div>
  <button class="btn ghost block" style="margin-top:14px" data-act="quiz">Пройти тест заново</button>`;
}

function Courses(){
  if(S.course){
    const c=COURSES[S.course]; const ls=courseLessons(c.id); const dn=doneCount(ls.map(l=>l.id));
    return `<button class="back" data-act="courses">← Все курсы</button>
    <section class="stack"><span class="eyebrow">${c.icon} ${ls.length} уроков</span><h1>${esc(c.title)}</h1><p class="muted">${esc(c.sub)}</p>
      <div class="row"><div class="bar" style="flex:1"><i style="width:${dn/ls.length*100}%"></i></div><span class="nums muted">${dn} / ${ls.length}</span></div>
      <a class="btn ghost" href="${link(c.topic)}" target="_blank" rel="noopener">Открыть ветку курса в клубе</a></section>
    <div class="list" style="margin-top:18px">${ls.map(l=>itemLesson(l)).join("")}</div>`;
  }
  const q=S.q.trim().toLowerCase();
  const filtering=q||S.filter!=="all";
  const res=filtering?L.filter(l=>(S.filter==="all"||l.tags.includes(S.filter)||(S.filter==="packaging"&&l.tags.includes("ctr"))||(S.filter==="script"&&l.tags.includes("retention"))||(S.filter==="sales"&&l.tags.includes("funnel")))&&(!q||(l.t+" "+l.a).toLowerCase().includes(q))):[];
  return `<section class="stack"><h1>Курсы</h1>
    <input class="search" id="q" type="search" placeholder="Найти урок: превью, звук, клиенты…" value="${esc(S.q)}" autocomplete="off">
    <div class="chips" role="group" aria-label="Темы">${THEMES.map(([k,v])=>`<button class="fchip" data-filter="${k}" aria-pressed="${S.filter===k}">${v}</button>`).join("")}</div></section>
  <div id="cres" style="margin-top:16px">${filtering
    ?(res.length?`<p class="muted" style="margin-bottom:10px">Найдено уроков: <span class="nums">${res.length}</span></p><div class="list">${res.map(l=>itemLesson(l,{course:1})).join("")}</div>`:`<div class="empty">Ничего не нашлось. Попробуй другое слово или тему.</div>`)
    :`<div class="courses">${Object.values(COURSES).map(courseCard).join("")}</div>`}</div>`;
}

function Live(){
  return `<section class="stack"><h1>Эфиры</h1><p class="muted">Эфиры клуба проходят в Telegram. Записи появляются в ветке «Записи эфиров и вебинаров».</p></section>
  <section class="section"><span class="eyebrow">Скоро</span>
    <div class="card event"><div class="date"><b>29</b><span>окт</span></div>
      <div class="stack" style="gap:4px;min-width:0"><h3>Открытый эфир клуба</h3><p class="muted">Четверг, 19:00 МСК. Разборы каналов, ответы на вопросы.</p></div></div>
  </section>
  <section class="section"><span class="eyebrow">Записи</span>
    <div class="empty">Первая запись появится после эфира 29 октября.</div>
    <a class="btn ghost block" href="${link(TOPICS.streams)}" target="_blank" rel="noopener">Открыть ветку с записями</a>
  </section>
  <section class="section"><span class="eyebrow">Регулярно в клубе</span>
    <div class="list">
      <a class="item" href="${link(TOPICS.tasting)}" target="_blank" rel="noopener"><span class="num">🍰</span><span class="txt"><b>Дегустация</b><span>Разборы роликов участников</span></span>${I.chev}</a>
      <a class="item" href="${link(TOPICS.filling)}" target="_blank" rel="noopener"><span class="num">🔍</span><span class="txt"><b>Разбор начинки</b><span>Разбираем чужие успешные ролики</span></span>${I.chev}</a>
      <a class="item" href="${link(TOPICS.bakery)}" target="_blank" rel="noopener"><span class="num">🏆</span><span class="txt"><b>Итоги пекарни</b><span>Результаты участников</span></span>${I.chev}</a>
    </div></section>`;
}

function Mat(){
  return `<section class="stack"><h1>Материалы</h1><p class="muted">Шаблоны и чек-листы из уроков. Сделай копию документа и работай в своей.</p></section>
  <section class="section"><span class="eyebrow">Шаблоны и чек-листы</span><div class="list">
    <a class="item" href="${link(TOPICS.materials,100)}" target="_blank" rel="noopener"><span class="num">✅</span><span class="txt"><b>Чек-лист идеального сценария</b><span>PDF · к уроку 6 «Школы YouTube»</span></span>${I.chev}</a>
    <a class="item" href="${link(TOPICS.materials,101)}" target="_blank" rel="noopener"><span class="num">📊</span><span class="txt"><b>Таблица анализа конкурентов</b><span>Google Таблица · к уроку 3</span></span>${I.chev}</a>
    <a class="item" href="${link(TOPICS.materials,101)}" target="_blank" rel="noopener"><span class="num">📝</span><span class="txt"><b>Простая структура сценария</b><span>Google Документ · к уроку 6</span></span>${I.chev}</a>
    <a class="item" href="${link(TOPICS.materials,101)}" target="_blank" rel="noopener"><span class="num">📝</span><span class="txt"><b>Расширенная структура сценария</b><span>Google Документ · к уроку 6</span></span>${I.chev}</a>
  </div></section>
  <section class="section"><span class="eyebrow">Гайды и статьи</span>
    <div class="list">
      ${["Как выбрать нишу, в которой есть деньги","100 тем для первых роликов","Как упаковать канал за вечер","Первые деньги с канала: 5 способов"].map(t=>`<div class="item locked"><span class="num lock">${I.lock}</span><span class="txt"><b>${t}</b><span>Скоро</span></span></div>`).join("")}
    </div></section>`;
}

function Me(){
  const all=L.length,dn=doneCount(L.map(l=>l.id)),m=L.filter(l=>S.done[l.id]).reduce((s,l)=>s+(l.m||5),0);
  const lv=S.profile?LEVELS[S.profile.lvl]:null;
  return `<section class="hero">${DRIP}
    <div class="level" style="margin-top:18px"><div class="ring">${lv?lv.icon:"🥐"}</div>
      <div class="stack" style="gap:6px;min-width:0"><h1 style="margin:0;font-size:22px">${esc(S.name)}</h1>
      <div class="row" style="flex-wrap:wrap;gap:6px"><span class="chip glaze">Первопроходец</span>${lv?`<span class="chip dough">${lv.name}</span>`:""}</div></div></div>
    <p class="muted">Статус «Первопроходец» есть у тех, кто вступил в клуб до 15 ноября.</p>
  </section>
  <section class="section"><h2>Прогресс</h2>
    <div class="links">
      <div class="link"><b class="nums" style="font-size:24px">${dn}</b><span>из ${all} уроков</span></div>
      <div class="link"><b class="nums" style="font-size:24px">${m}</b><span>минут обучения</span></div>
    </div>
    <div class="list">${Object.values(COURSES).map(c=>{const ls=courseLessons(c.id),d=doneCount(ls.map(l=>l.id));return `<button class="item" data-course="${c.id}"><span class="num">${c.icon}</span><span class="txt"><b>${c.title}</b><span class="nums">${d} из ${ls.length}</span></span>${I.chev}</button>`}).join("")}</div>
  </section>
  <section class="section"><h2>Настройки</h2><div class="list">
    <button class="item" data-act="quiz"><span class="num">🧭</span><span class="txt"><b>${S.profile?"Пройти тест заново":"Подобрать уроки под себя"}</b><span>5 вопросов</span></span>${I.chev}</button>
    <a class="item" href="${link(TOPICS.rules)}" target="_blank" rel="noopener"><span class="num">📌</span><span class="txt"><b>Правила клуба</b><span>Ветка «Начни здесь»</span></span>${I.chev}</a>
    <a class="item" href="https://t.me/profitrolik_club_bot" target="_blank" rel="noopener"><span class="num">🤖</span><span class="txt"><b>Подписка и поддержка</b><span>@profitrolik_club_bot</span></span>${I.chev}</a>
    <button class="item" data-act="reset"><span class="num">↺</span><span class="txt"><b>Сбросить прогресс</b><span>Отметки просмотра и трек</span></span></button>
  </div></section>`;
}

function Quiz(){
  const st=S.quiz; const q=QUIZ[st.i];
  return `<div class="quiz">
    <div class="row between"><button class="back" data-act="qback">← ${st.i?"Назад":"Выйти"}</button><span class="muted nums">${st.i+1} из ${QUIZ.length}</span></div>
    <div class="steps">${QUIZ.map((_,i)=>`<i class="${i<=st.i?"on":""}"></i>`).join("")}</div>
    <h1>${q.q}</h1>
    <div class="opts">${q.o.map(([v,e,t])=>`<button class="opt" data-ans="${v}"><span class="em">${e}</span><span>${t}</span></button>`).join("")}</div>
  </div>`;
}

function Result(){
  const p=S.profile, lv=LEVELS[p.lvl];
  const first=p.ids.slice(0,3).map(id=>byId[id]);
  const cnt={};p.ids.forEach(id=>{const c=byId[id].c;cnt[c]=(cnt[c]||0)+1});
  return `<section class="hero">${DRIP}
    <div class="level" style="margin-top:18px"><div class="ring">${lv.icon}</div><div class="stack" style="gap:4px"><span class="eyebrow">Твой уровень</span><h1 style="margin:0">${lv.name}</h1></div></div>
    <p>Собрали трек из <b class="nums">${p.ids.length}</b> уроков: фокус на ${p.focus}, цель: ${p.goal}.</p>
    <div class="row" style="flex-wrap:wrap;gap:6px">${Object.entries(cnt).map(([c,n])=>`<span class="chip">${COURSES[c].icon} ${COURSES[c].title}: ${n}</span>`).join("")}</div>
  </section>
  <section class="section"><h2>Начни с этих</h2><div class="list">${first.map((l,i)=>itemLesson(l,{idx:i+1,course:1,now:i===0,locked:i>0})).join("")}</div>
    <button class="btn primary block" data-lesson="${first[0].id}">Смотреть первый урок</button>
    <button class="btn ghost block" data-act="track">Весь трек</button>
    <a class="btn ghost block" href="${link(TOPICS[lv.chat])}" target="_blank" rel="noopener">Чат уровня «${LEVELS[lv.chat].name}»</a>
  </section>`;
}

function Sheet(l){
  const c=COURSES[l.c], d=!!S.done[l.id];
  const t=trackState(); const inTrack=t&&t.ids.includes(l.id);
  return `<div class="scrim" data-act="close"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(l.t)}">
    <div class="grab"></div>
    <div class="row" style="flex-wrap:wrap;gap:6px"><span class="chip">${c.icon} ${c.title}</span><span class="chip nums">Урок ${l.n}</span><span class="chip">${mins(l.m)}</span>${inTrack?'<span class="chip dough">В твоём треке</span>':""}</div>
    <h2 style="font-size:22px">${esc(l.t)}</h2>
    <p class="muted">${esc(l.a)}</p>
    ${l.tags.filter(x=>x!=="producer").length?`<div class="row" style="flex-wrap:wrap;gap:6px">${l.tags.filter(x=>x!=="producer").map(x=>`<span class="eyebrow">#${tagLabel(x)}</span>`).join("")}</div>`:""}
    <a class="btn primary block" href="${lessonLink(l)}" target="_blank" rel="noopener">▶ Смотреть в клубе</a>
    <button class="btn ${d?"ghost":"ghost"} block" data-done="${l.id}">${d?I.check+" Просмотрено":"Отметить просмотренным"}</button>
  </div></div>`;
}

/* ---------- render ---------- */
const TABS=[["home","Главная",I.home],["courses","Курсы",I.courses],["live","Эфиры",I.live],["mat","Материалы",I.mat],["me","Профиль",I.me]];
function render(keepScroll){
  const app=document.getElementById("app");
  const top=`<header class="top"><img src="${LOGO}" alt="Профитролик"><div class="who"><span class="eyebrow">Профитролик · клуб</span><b>Привет, ${esc(S.name)}</b></div><span class="chip glaze">Первопроходец</span></header>`;
  let body;
  if(S.quiz) body=Quiz();
  else if(S.tab==="result") body=Result();
  else if(S.tab==="track") body=Track();
  else body={home:Home,courses:Courses,live:Live,mat:Mat,me:Me}[S.tab]();
  app.innerHTML=(S.quiz?"":top)+body;
  const cur=S.tab==="track"||S.tab==="result"?"home":S.tab;
  document.getElementById("tabs").innerHTML=TABS.map(([k,v,ic])=>`<button class="tab" data-tab="${k}"${cur===k&&!S.quiz?' aria-current="page"':""}>${ic}<span>${v}</span></button>`).join("");
  if(!keepScroll) window.scrollTo(0,0);
  const q=document.getElementById("q");
  if(q){q.addEventListener("input",()=>{S.q=q.value;const pos=q.selectionStart;render(true);const n=document.getElementById("q");n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}})}
}
function sheet(id){const l=byId[id];document.getElementById("layer").innerHTML=Sheet(l)}
function closeSheet(){document.getElementById("layer").innerHTML=""}

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-tab],[data-act],[data-lesson],[data-course],[data-filter],[data-ans],[data-done]");
  if(!el) return;
  if(el.dataset.act==="close"&&e.target!==el) return;
  if(el.dataset.tab){S.tab=el.dataset.tab;S.course=null;S.quiz=null;closeSheet();render();return}
  if(el.dataset.course){S.tab="courses";S.course=el.dataset.course;render();return}
  if(el.dataset.filter){S.filter=el.dataset.filter;render(true);return}
  if(el.dataset.lesson){
    if(el.dataset.locked){toast("Откроется после предыдущего урока");return}
    sheet(el.dataset.lesson);return}
  if(el.dataset.done){
    const id=el.dataset.done;const was=!!S.done[id];
    if(was) delete S.done[id]; else S.done[id]=Date.now();
    store.set("done",S.done);
    const t=trackState();
    closeSheet();render(true);
    if(!was&&t&&t.ids.includes(id)){ toast(t.cur>=0?"Готово! Следующий урок трека открыт":"Трек пройден целиком 🎉") } else toast(was?"Отметка снята":"Отмечено");
    return}
  if(el.dataset.ans){
    const st=S.quiz; st.a[QUIZ[st.i].k]=el.dataset.ans;
    if(st.i<QUIZ.length-1){st.i++;render()}
    else{S.profile=buildTrack(st.a);store.set("profile",S.profile);S.quiz=null;S.tab="result";render()}
    return}
  const a=el.dataset.act;
  if(a==="quiz"){S.quiz={i:0,a:{}};closeSheet();render()}
  else if(a==="qback"){if(S.quiz.i)S.quiz.i--;else S.quiz=null;render()}
  else if(a==="track"){S.tab="track";render()}
  else if(a==="courses"){S.course=null;render()}
  else if(a==="close"){closeSheet()}
  else if(a==="reset"){
    if(el.dataset.sure){S.done={};S.profile=null;store.set("done",{});store.set("profile",null);toast("Прогресс сброшен");render()}
    else{el.dataset.sure="1";el.querySelector(".txt b").textContent="Нажми ещё раз, чтобы сбросить";}
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});

(async()=>{
  render();
  const [d,p]=await Promise.all([store.get("done"),store.get("profile")]);
  if(d) S.done=d;
  if(p) S.profile=p;
  render();
})();
</script>

</body>
</html>
